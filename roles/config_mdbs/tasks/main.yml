---
# tasks file for zephyr82.mariadb.config_mdbs

- name: Include OS specific variables
  ansible.builtin.include_vars:
    file: "{{ item }}"
  with_first_found:
    - "os_{{ ansible_facts['os_family'] }}.yml"
    - "dist_{{ ansible_facts['distribution'] }}.yml"
    - "os_default.yml"
  tags:
    - always

- name: Include tasks for configuring MariaDB bind-address
  ansible.builtin.include_tasks:
    file: bind_address.yml
  tags:
    - mariadb_configuration
    - debug

- name: Include tasks for configuring MariaDB event_scheduler
  ansible.builtin.include_tasks:
    file: event_scheduler.yml
  tags:
    - mariadb_configuration
    - debug
