---
# tasks file for zephyr82.mariadb.installation

- name: Include OS specific variables
  ansible.builtin.include_vars:
    file: "{{ item }}"
  with_first_found:
    - "os_{{ ansible_facts['os_family'] }}.yml"
    - "dist_{{ ansible_facts['distribution'] }}.yml"
    - "os_default.yml"
  tags:
    - always

- name: Include OS specific installation tasks
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  with_first_found:
    - "installation/{{ ansible_facts['os_family'] }}.yml"
    - installation/default.yml
  tags:
    - mariadb_installation

- name: Ensure MariaDB server is enabled and running
  ansible.builtin.service:
    enabled: true
    name: "{{ installation_mariadb_service }}"
    state: started
